# H2 in memory, PostgreSQL compatibility mode. Same Flyway migrations, same seed data.
# Used by the tests, by laptops without Docker, and by Claude Code on the web.
spring.datasource.url=jdbc:h2:mem:ops;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.application.name=ops-dashboard
server.port=8080

# Which database to use. "postgres" is the default; set SPRING_PROFILES_ACTIVE=demo
# for an in-memory H2 database with the same migrations (no Docker needed).
spring.profiles.default=postgres

# The dashboard's "today". The seed data covers the 90 days before this date, so the
# clock is pinned rather than read from the machine. See ClockConfig.
ops.today=2026-09-21

spring.flyway.locations=classpath:db/migration

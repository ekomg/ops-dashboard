name: CI

on:
  pull_request:

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # The tests run on the in-memory demo profile; no PostgreSQL service is needed.
      - run: SPRING_PROFILES_ACTIVE=demo ./mvnw -q test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npm test
